# Qdrant en local para el bloque de base de datos vectorial del notebook 3.
# Imagen oficial: https://hub.docker.com/r/qdrant/qdrant (versión fijada, publicada el 2026-10-05).
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - 6333:6333   # API REST y panel web (http://localhost:6333/dashboard)
      - 6334:6334   # API gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
