[project]
name = "rag-lab-semana2"
version = "0.1.0"
description = "Semana 2: embeddings, RAG multimodal y RAG por versiones"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "sentence-transformers",
    "transformers",
    "accelerate",
    "docling",
    "chromadb",
    "scikit-learn",
    "bm25s",
    "PyStemmer",
    "openai",
    "langfuse",
    "pandas",
    "matplotlib",
    "pymupdf",
    "pillow",
    "ranx",
    "ragas",
    # ragas 0.4.3 importa langchain_community.chat_models.vertexai, que no existe en langchain-community 0.4
    "langchain-community<0.4",
    "python-dotenv",
    "huggingface-hub",
    "requests",
    "qdrant-client==1.19.1",
    "jupyter",
    "nbconvert",
    "ipykernel",
    "ipywidgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_lab"]

# Igual que en la semana 1: torch con CUDA 12.8 en Linux y Windows; en macOS, torch estándar.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
